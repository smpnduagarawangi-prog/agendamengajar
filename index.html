<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Mengajar</title>
  <style>
    :root { --ink:#102a43; --muted:#6b7c93; --paper:#f5f8fa; --white:#fff; --line:#dce5eb; --teal:#087f8c; --teal-dark:#05616c; --orange:#ef8354; --green:#237a57; --red:#c94c4c; --shadow:0 16px 40px rgba(16,42,67,.08); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family: Calibri, Arial, sans-serif; }
    button, input, select, textarea { font:inherit; }
    button { cursor:pointer; border:0; }
    .hidden { display:none !important; }
    .login-screen { min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 12% 12%, #d5f0ef 0, transparent 35%), linear-gradient(135deg,#eff8f7,#f8f4ed); }
    .login-box { width:min(430px,100%); background:rgba(255,255,255,.92); border:1px solid var(--line); padding:36px; box-shadow:var(--shadow); }
    .mark { color:var(--teal); font:700 12px/1.2 Calibri,Arial,sans-serif; letter-spacing:2px; text-transform:uppercase; }
    h1,h2,h3,p { margin-top:0; } h1 { font-size:clamp(32px,6vw,54px); line-height:.96; margin:14px 0; letter-spacing:-1px; } h2 { font-size:30px; margin-bottom:6px; } h3 { margin-bottom:5px; }
    .subtle { color:var(--muted); font:14px/1.5 Calibri,Arial,sans-serif; }
    .field { display:grid; gap:7px; margin:16px 0; } .field label { font:700 12px Calibri,Arial,sans-serif; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; } input, select, textarea { width:100%; border:1px solid var(--line); background:#fff; color:var(--ink); padding:12px 13px; border-radius:4px; outline:none; } input:focus, select:focus, textarea:focus { border-color:var(--teal); box-shadow:0 0 0 3px rgba(8,127,140,.12); } textarea { min-height:92px; resize:vertical; }
    .primary { color:#fff; background:var(--teal); padding:13px 18px; border-radius:4px; font-weight:700; } .primary:hover { background:var(--teal-dark); } .secondary { color:var(--ink); background:#eaf0f2; padding:11px 15px; border-radius:4px; } .danger { color:var(--red); background:#fff0ef; padding:9px 12px; border-radius:4px; }
    .app { min-height:100vh; } .topbar { background:var(--ink); color:#fff; padding:18px max(20px, calc((100vw - 1180px)/2)); display:flex; align-items:center; justify-content:space-between; gap:16px; } .topbar .mark { color:#9fe2dc; } .topbar button { color:#fff; background:transparent; border:1px solid rgba(255,255,255,.3); padding:9px 13px; border-radius:4px; }
    .shell { width:min(1180px, calc(100% - 40px)); margin:34px auto 60px; } .welcome { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:28px; } .identity { display:flex; gap:10px; flex-wrap:wrap; font:13px Calibri,Arial,sans-serif; color:var(--muted); } .identity span { background:#e4f1ef; padding:6px 9px; border-radius:3px; } .toolbar { display:flex; gap:10px; align-items:end; flex-wrap:wrap; } .toolbar .field { margin:0; min-width:170px; }
    .tabs { display:flex; gap:5px; border-bottom:1px solid var(--line); margin-bottom:24px; } .tab { background:transparent; color:var(--muted); padding:11px 16px; border-bottom:3px solid transparent; font-weight:700; } .tab.active { color:var(--teal); border-color:var(--teal); }
    .schedule-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(265px,1fr)); gap:14px; } .schedule-card { background:#fff; border:1px solid var(--line); padding:18px; box-shadow:0 6px 20px rgba(16,42,67,.04); border-left:5px solid var(--orange); } .schedule-card.done { border-left-color:var(--green); } .schedule-head { display:flex; justify-content:space-between; gap:12px; align-items:start; } .schedule-time { color:var(--teal-dark); font:bold 14px Calibri,Arial,sans-serif; } .schedule-class { font-size:27px; margin:10px 0 3px; } .status { display:inline-block; font:700 11px Calibri,Arial,sans-serif; padding:5px 8px; border-radius:20px; background:#fff0db; color:#9a5a18; } .status.done { background:#e3f4e9; color:var(--green); } .card-actions { display:flex; gap:8px; margin-top:18px; } .card-actions button { flex:1; padding:10px 8px; border-radius:4px; font-size:13px; } .fill { background:var(--teal); color:#fff; } .view { background:#edf3f3; color:var(--teal-dark); }
    .history-tools { display:grid; grid-template-columns:repeat(3,1fr) auto; gap:10px; align-items:end; margin-bottom:18px; } .history-list { display:grid; gap:10px; } .history-row { background:#fff; border:1px solid var(--line); padding:16px; display:grid; grid-template-columns:115px 80px 1fr auto; gap:15px; align-items:start; } .history-row strong { display:block; font-size:18px; } .history-row small { font:12px Calibri,Arial,sans-serif; color:var(--muted); } .history-main { min-width:0; } .history-details { grid-column:1 / -1; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; border-top:1px solid var(--line); padding-top:14px; } .history-detail { min-width:0; } .history-detail-label { display:block; margin-bottom:5px; font:700 11px Calibri,Arial,sans-serif; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; } .history-detail-value { color:var(--ink); font:14px/1.45 Calibri,Arial,sans-serif; white-space:pre-wrap; overflow-wrap:anywhere; } .history-actions { display:flex; gap:7px; } .empty { background:#fff; border:1px dashed #b9cbd2; padding:36px; text-align:center; color:var(--muted); }
    .modal-backdrop { position:fixed; inset:0; background:rgba(16,42,67,.55); display:grid; place-items:center; padding:18px; z-index:5; } .modal { background:#fff; width:min(680px,100%); max-height:92vh; overflow:auto; padding:26px; box-shadow:var(--shadow); } .modal-title { display:flex; justify-content:space-between; gap:15px; } .close { background:#eef3f4; width:34px; height:34px; border-radius:50%; font-size:22px; } .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 15px; } .span-2 { grid-column:span 2; } .modal-footer { display:flex; justify-content:flex-end; gap:10px; margin-top:10px; }
    .toast { position:fixed; right:20px; bottom:20px; z-index:10; background:var(--ink); color:#fff; padding:13px 17px; border-left:4px solid var(--orange); box-shadow:var(--shadow); font:14px Calibri,Arial,sans-serif; } .loading { color:var(--muted); text-align:center; padding:30px; font:14px Calibri,Arial,sans-serif; }
    @media (max-width:700px) { .shell { width:min(100% - 28px,1180px); margin-top:24px; } .welcome { display:block; } .welcome .toolbar { margin-top:20px; } .history-tools { grid-template-columns:1fr 1fr; } .history-tools .search { grid-column:span 2; } .history-row { grid-template-columns:1fr 1fr; gap:8px; } .history-row .history-main { grid-column:span 2; } .history-details { grid-template-columns:1fr; gap:10px; } .history-actions { grid-column:span 2; } .form-grid { display:block; } .topbar { padding:15px 14px; } .login-box { padding:26px 22px; } }
  </style>
</head>
<body>
  <section id="loginScreen" class="login-screen">
    <div class="login-box"><div class="mark">Agenda Mengajar</div><h1>Ruang kerja<br>guru.</h1><p class="subtle">Masuk untuk melihat jadwal dan mencatat pembelajaran hari ini.</p>
      <form id="loginForm"><div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username" required></div><div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="primary" type="submit" style="width:100%">Masuk ke dashboard</button></form>
    </div>
  </section>
  <section id="app" class="app hidden"><header class="topbar"><div><div class="mark">Agenda Mengajar</div><strong>Catatan pembelajaran sekolah</strong></div><button id="logoutButton">Keluar</button></header><main class="shell">
    <div class="welcome"><div><h2 id="teacherName">Dashboard</h2><div id="identity" class="identity"></div></div><div class="toolbar"><div class="field"><label for="datePicker">Tanggal agenda</label><input id="datePicker" type="date"></div><button id="refreshButton" class="secondary">Muat ulang</button></div></div>
    <nav class="tabs"><button class="tab active" data-view="dashboard">Jadwal hari ini</button><button class="tab" data-view="history">Riwayat agenda</button></nav>
    <section id="dashboardView"><p id="dayLabel" class="subtle"></p><div id="scheduleGrid" class="schedule-grid"></div></section>
    <section id="historyView" class="hidden"><div class="history-tools"><div class="field search"><label for="historySearch">Cari materi atau kegiatan</label><input id="historySearch" type="search" placeholder="Ketik kata kunci..."></div><div class="field"><label for="historyDate">Tanggal</label><input id="historyDate" type="date"></div><div class="field"><label for="historyClass">Kelas</label><select id="historyClass"><option value="">Semua kelas</option></select></div><button id="exportButton" class="secondary">Ekspor PDF</button></div><div id="historyList" class="history-list"></div></section>
  </main></section>
  <div id="modalBackdrop" class="modal-backdrop hidden"><div class="modal"><div class="modal-title"><div><div class="mark">Form agenda</div><h2 id="modalHeading">Isi agenda</h2><p id="modalMeta" class="subtle"></p></div><button id="closeModal" class="close" aria-label="Tutup">&times;</button></div><form id="agendaForm"><input id="agendaId" type="hidden"><div class="form-grid"><div class="field"><label for="agendaDate">Tanggal</label><input id="agendaDate" type="date" required></div><div class="field"><label for="agendaStatus">Status</label><select id="agendaStatus"><option>Draft</option><option>Selesai</option></select></div><div class="field span-2"><label for="agendaMateri">Materi</label><input id="agendaMateri" required placeholder="Contoh: Persamaan linear satu variabel"></div><div class="field span-2"><label for="agendaKegiatan">Kegiatan pembelajaran</label><textarea id="agendaKegiatan" required placeholder="Ringkas kegiatan pembelajaran di kelas"></textarea></div><div class="field"><label for="agendaAsesmen">Asesmen</label><textarea id="agendaAsesmen" placeholder="Tugas, observasi, kuis..." required></textarea></div><div class="field"><label for="agendaCatatan">Catatan</label><textarea id="agendaCatatan" placeholder="Catatan tambahan"></textarea></div></div><div class="modal-footer"><button type="button" id="cancelModal" class="secondary">Batal</button><button type="submit" class="primary">Simpan agenda</button></div></form></div></div><div id="toast" class="toast hidden"></div>
  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyo6448gS7a7WfqFE8oTCtcmHP1jyYcpeGfEyKWCarOW7PoZbxyZlImIsZnxfCZJvb_/exec';
    const state = { user:null, schedule:[], history:[], selected:null };
    const $ = id => document.getElementById(id);
    const dayNames = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    function today() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
    function showToast(message, isError=false) { const node=$('toast'); node.textContent=message; node.style.borderLeftColor=isError?'#e76f51':'#ef8354'; node.classList.remove('hidden'); setTimeout(()=>node.classList.add('hidden'),3200); }
    async function callServer(method, ...args) { const request={action:method}; if(method==='loginUser') [request.email,request.password]=args; if(method==='getTeacherSchedule') [request.email,request.dayName,request.dateStr]=args; if(method==='saveAgenda') request.payload=args[0]; if(method==='getAgendaHistory') [request.email,request.filterDate,request.filterClass,request.searchQuery]=args; if(method==='deleteAgenda') [request.email,request.agendaId]=args; if(method==='exportAgendaPdf') [request.email,request.filterDate,request.filterClass,request.searchQuery,request.teacherName,request.subject]=args; const response=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(request)}); if(!response.ok) throw new Error('Server API mengembalikan HTTP '+response.status+'.'); const result=await response.json(); return result; }
    function setUser(user) { state.user=user; sessionStorage.setItem('agendaUser',JSON.stringify(user)); }
    function renderIdentity() { $('teacherName').textContent=state.user.namaGuru||'Guru'; $('identity').innerHTML='<span>'+escapeHtml(state.user.mapel||'-')+'</span><span>Kelas '+escapeHtml(state.user.kelas||'-')+'</span><span>'+escapeHtml(state.user.email)+'</span>'; }
    function escapeHtml(value) { return String(value??'').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char])); }
    function switchView(view) { document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.view===view)); $('dashboardView').classList.toggle('hidden',view!=='dashboard'); $('historyView').classList.toggle('hidden',view!=='history'); if(view==='history') loadHistory(); }
    function renderSchedule() { const grid=$('scheduleGrid'); if(!state.schedule.length) { grid.innerHTML='<div class="empty">Tidak ada jadwal mengajar untuk hari ini.</div>'; return; } grid.innerHTML=state.schedule.map(item=>{ const done=item.status==='Selesai'; return '<article class="schedule-card '+(done?'done':'')+'"><div class="schedule-head"><div class="schedule-time">'+escapeHtml(item.jam)+'</div><span class="status '+(done?'done':'')+'">'+escapeHtml(item.status)+'</span></div><div class="schedule-class">'+escapeHtml(item.kelas)+'</div><div class="subtle">'+escapeHtml(item.mapel)+'</div><div class="card-actions"><button class="fill" data-action="agenda" data-id="'+escapeHtml(item.agendaId||'')+'">'+(item.agendaId?'Edit agenda':'Isi agenda')+'</button>'+(item.agendaId?'<button class="view" data-action="view" data-id="'+escapeHtml(item.agendaId)+'">Lihat</button>':'')+'</div></article>'; }).join(''); }
    async function loadSchedule() { const date=$('datePicker').value; $('dayLabel').textContent=dayNames[new Date(date+'T12:00:00').getDay()]+' · '+new Date(date+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}); $('scheduleGrid').innerHTML='<div class="loading">Memuat jadwal...</div>'; try { const result=await callServer('getTeacherSchedule',state.user.email,dayNames[new Date(date+'T12:00:00').getDay()],date); if(!result.success) throw new Error(result.message); state.schedule=result.schedule||[]; renderSchedule(); } catch(error) { $('scheduleGrid').innerHTML='<div class="empty">'+escapeHtml(error.message)+'</div>'; } }
    function openModal(item, agenda) { state.selected={...item,...(agenda||{})}; $('agendaId').value=agenda?.id||item.agendaId||''; $('agendaDate').value=agenda?.tanggal||$('datePicker').value; $('agendaStatus').value=agenda?.status||'Draft'; $('agendaMateri').value=agenda?.materi||''; $('agendaKegiatan').value=agenda?.kegiatan||''; $('agendaAsesmen').value=agenda?.asesmen||''; $('agendaCatatan').value=agenda?.catatan||''; $('modalHeading').textContent=agenda?'Edit agenda':'Isi agenda'; $('modalMeta').textContent=item.jam+' · '+item.kelas+' · '+item.mapel; $('modalBackdrop').classList.remove('hidden'); }
    async function openExisting(id, fallback) { try { const result=await callServer('getAgendaHistory',state.user.email,'','', ''); const agenda=(result.agendas||[]).find(item=>String(item.id)===String(id)); if(agenda) openModal(fallback,agenda); else showToast('Detail agenda tidak ditemukan.',true); } catch(error) { showToast(error.message,true); } }
    function closeModal() { $('modalBackdrop').classList.add('hidden'); $('agendaForm').reset(); }
    async function loadHistory() { const result=await callServer('getAgendaHistory',state.user.email,$('historyDate').value,$('historyClass').value,$('historySearch').value).catch(error=>({success:false,message:error.message})); if(!result.success) { $('historyList').innerHTML='<div class="empty">'+escapeHtml(result.message)+'</div>'; return; } state.history=result.agendas||[]; const classes=[...new Set(state.history.map(item=>item.kelas))].filter(Boolean); const selected=$('historyClass').value; $('historyClass').innerHTML='<option value="">Semua kelas</option>'+classes.map(item=>'<option>'+escapeHtml(item)+'</option>').join(''); $('historyClass').value=selected; renderHistory(); }
    function renderHistory() { const list=$('historyList'); if(!state.history.length) { list.innerHTML='<div class="empty">Belum ada agenda yang tersimpan.</div>'; return; } list.innerHTML=state.history.map(item=>'<article class="history-row"><div><small>tanggal</small><strong>'+escapeHtml(item.tanggal)+'</strong></div><div><small>kelas</small><strong>'+escapeHtml(item.kelas)+'</strong></div><div class="history-main"><strong>'+escapeHtml(item.materi||'Tanpa materi')+'</strong><small>'+escapeHtml(item.jam)+' · '+escapeHtml(item.hari)+' · '+escapeHtml(item.status)+'</small></div><div class="history-actions"><button class="secondary" data-history="edit" data-id="'+escapeHtml(item.id)+'">Edit</button><button class="danger" data-history="delete" data-id="'+escapeHtml(item.id)+'">Hapus</button></div><div class="history-details"><div class="history-detail"><span class="history-detail-label">Kegiatan pembelajaran</span><div class="history-detail-value">'+escapeHtml(item.kegiatan||'-')+'</div></div><div class="history-detail"><span class="history-detail-label">Asesmen</span><div class="history-detail-value">'+escapeHtml(item.asesmen||'-')+'</div></div><div class="history-detail"><span class="history-detail-label">Catatan</span><div class="history-detail-value">'+escapeHtml(item.catatan||'-')+'</div></div></div></article>').join(''); }
    $('loginForm').addEventListener('submit',async event=>{ event.preventDefault(); const button=event.target.querySelector('button'); button.disabled=true; button.textContent='Memeriksa...'; try { const result=await callServer('loginUser',$('loginEmail').value,$('loginPassword').value); if(!result.success) throw new Error(result.message); setUser(result.user); $('loginScreen').classList.add('hidden'); $('app').classList.remove('hidden'); renderIdentity(); $('datePicker').value=today(); await loadSchedule(); } catch(error) { showToast(error.message,true); } finally { button.disabled=false; button.textContent='Masuk ke dashboard'; } });
    $('datePicker').addEventListener('change',loadSchedule); $('refreshButton').addEventListener('click',loadSchedule); document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>switchView(tab.dataset.view))); $('historyDate').addEventListener('change',loadHistory); $('historyClass').addEventListener('change',loadHistory); $('historySearch').addEventListener('input',()=>{ clearTimeout(window.historyTimer); window.historyTimer=setTimeout(loadHistory,350); }); $('logoutButton').addEventListener('click',()=>{ sessionStorage.removeItem('agendaUser'); location.reload(); });
    $('scheduleGrid').addEventListener('click',event=>{ const button=event.target.closest('button'); if(!button)return; const item=state.schedule.find(entry=>String(entry.agendaId||'')===button.dataset.id)||state.schedule.find(entry=>entry===state.schedule.find(x=>x.agendaId===null)); if(button.dataset.action==='agenda') { const selected=state.schedule.find(entry=>String(entry.agendaId||'')===button.dataset.id)||state.schedule.find(entry=>entry.kelas===button.closest('article').querySelector('.schedule-class').textContent); button.dataset.id?openExisting(button.dataset.id,selected):openModal(selected); } else if(button.dataset.action==='view') openExisting(button.dataset.id,item); });
    $('historyList').addEventListener('click',async event=>{ const button=event.target.closest('button'); if(!button)return; const item=state.history.find(entry=>String(entry.id)===button.dataset.id); if(button.dataset.history==='edit') openModal(item,item); if(button.dataset.history==='delete' && confirm('Hapus agenda ini?')) { const result=await callServer('deleteAgenda',state.user.email,item.id); if(result.success){showToast(result.message);loadHistory();loadSchedule();}else showToast(result.message,true); } });
    $('agendaForm').addEventListener('submit',async event=>{ event.preventDefault(); const item=state.selected; const payload={id:$('agendaId').value,email:state.user.email,tanggal:$('agendaDate').value,hari:dayNames[new Date($('agendaDate').value+'T12:00:00').getDay()],kelas:item.kelas,mapel:item.mapel,jam:item.jam,materi:$('agendaMateri').value,kegiatan:$('agendaKegiatan').value,asesmen:$('agendaAsesmen').value,catatan:$('agendaCatatan').value,status:$('agendaStatus').value,created_at:item.created_at}; const result=await callServer('saveAgenda',payload); if(result.success){closeModal();showToast(result.message);await loadSchedule();if(!$('historyView').classList.contains('hidden'))loadHistory();}else showToast(result.message,true); }); $('closeModal').addEventListener('click',closeModal); $('cancelModal').addEventListener('click',closeModal); $('exportButton').addEventListener('click',async()=>{ const button=$('exportButton'); const originalText=button.textContent; button.disabled=true; button.textContent='Membuat PDF...'; try { const result=await callServer('exportAgendaPdf',state.user.email,$('historyDate').value,$('historyClass').value,$('historySearch').value,state.user.namaGuru,state.user.mapel); if(!result.success) throw new Error(result.message); const binary=atob(result.base64); const bytes=new Uint8Array(binary.length); for(let index=0;index<binary.length;index++) bytes[index]=binary.charCodeAt(index); const blobUrl=URL.createObjectURL(new Blob([bytes],{type:result.mimeType||'application/pdf'})); const link=document.createElement('a'); link.href=blobUrl; link.download=result.filename||'riwayat-agenda.pdf'; document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(blobUrl),1000); showToast(result.message); } catch(error) { showToast(error.message,true); } finally { button.disabled=false; button.textContent=originalText; } });
    const stored=sessionStorage.getItem('agendaUser'); if(stored) { try { state.user=JSON.parse(stored); $('loginScreen').classList.add('hidden'); $('app').classList.remove('hidden'); renderIdentity(); $('datePicker').value=today(); loadSchedule(); } catch(error) { sessionStorage.removeItem('agendaUser'); } }
  </script>
</body>
</html>
